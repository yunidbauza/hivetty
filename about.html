<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>About HiveTTY</title>
    <!--
      Nothing paints until about.css does. The window can draw before that
      stylesheet applies (always under the dev server, where Vite injects it
      from the module; on a slow cold start in a build), and the copy below
      would show for a moment as unstyled black text. about.css reveals the body.
    -->
    <style>
      body {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      The About panel — a third renderer entry beside `index.html` and
      `splash.html`, and the reason `electron.vite.config.ts` now names three.

      It replaces Electron's default about panel, which showed the *framework's*
      name and version: true of the runtime, and about as informative as a car
      telling you who made its gearbox.

      Unlike the splash, this one is allowed to know things. The splash is
      deliberately dumb because anything it could be told would arrive over a
      channel that outlives it by seconds; this window opens on demand, long
      after the bridge is up, so it asks `window.hive` for the same `AppInfo`
      the Advanced pane uses — the interface whose own docblock says it exists
      "for the About box and bug reports".

      The hero is the splash's brood world, not a second copy: `startGlobe`
      from `src/splash/stage.ts`.
    -->
    <main class="panel">
      <div class="hero">
        <div class="bloom"></div>

        <!-- The splash's brood world, formed and turning (`about.ts`). -->
        <canvas class="globe" id="globe" aria-hidden="true"></canvas>

        <div class="vignette"></div>
      </div>

      <section class="copy">
        <h1 class="wordmark" aria-label="HiveTTY">
          <span>H</span><span>I</span><span>V</span><span>E</span
          ><em class="tty" aria-hidden="true"><i>t</i><i>t</i><i>y</i><b class="cursor"></b></em>
        </h1>

        <!-- Filled by `about.ts` from `appInfo()`; the markup ships no version. -->
        <p class="version" id="version">&nbsp;</p>
        <p class="phrase" id="phrase">&nbsp;</p>

        <!--
          One live region for the whole update surface. Hidden until the status
          resolves, so the panel never flashes a claim it has not established —
          `checked: false` is thirty seconds of every launch and reads exactly
          like "up to date" if you let it.
        -->
        <div class="update" id="update" hidden>
          <button class="cta" id="cta" type="button" hidden></button>
          <p class="update-note" id="update-note" aria-live="polite"></p>
        </div>

        <!--
          Two lines by necessity, not by taste: as one, this wrapped inside a
          version number, and half a version pasted into a bug report is wrong
          rather than merely ugly. See `runtimeLine`.
        -->
        <p class="build" id="build">
          <span id="platform">&nbsp;</span>
          <span id="runtime">&nbsp;</span>
        </p>
      </section>
    </main>

    <script type="module" src="/src/about/about.ts"></script>
  </body>
</html>

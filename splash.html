<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Hive</title>
    <!--
      Nothing paints until splash.css does. The window can draw before that
      stylesheet applies (always under the dev server, where Vite injects it
      from the module; on a slow cold start in a build), and the copy below
      would show for a moment as unstyled black text. splash.css reveals the body.
    -->
    <style>
      body {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      The cold-start splash — a second renderer entry beside `index.html`, and
      the whole reason `electron.vite.config.ts` names two inputs.

      It shares nothing with the app: no React, no stores, no `src/main.tsx`. A
      splash that imports the app bundle is a splash that waits for the app
      bundle, which is precisely the wait it exists to cover.

      The copy is fixed. Every value here would have to arrive over a channel
      that lives only for the few seconds before the real window
      opens, and the real window is a better place to say anything true.
    -->
    <div class="chamber">
      <div class="bloom"></div>

      <!--
        The brood world: comb chambers bud from a seed into a spherical volume
        nothing outlines, each log line lands on them, and seven mutalisks tear
        out of their chambers to circle a ring of spores. One transparent canvas
        the size of the chamber, the creep included; the bloom stays CSS beneath
        it. `splash.ts` draws it.
      -->
      <canvas class="globe" id="globe" aria-hidden="true"></canvas>

      <div class="vignette"></div>
      <div class="scanlines"></div>

      <div class="copy">
        <p class="kicker">overmind · swarm awakening</p>
        <p class="wordmark" aria-label="Hive TTY">
          <span>H</span><span>I</span><span>V</span><span>E</span
          ><em class="tty" aria-hidden="true"><i>t</i><i>t</i><i>y</i><b class="cursor"></b></em>
        </p>
        <ul class="log">
          <li>spawning drones · 4 sessions attached</li>
          <li>PATH inherited from zsh · 42 entries</li>
          <li>creep spread · 3 repositories</li>
          <li class="attention">2 awaiting your command</li>
          <li class="online">hive cluster online</li>
        </ul>
      </div>

      <div class="rule"></div>
      <p class="build">community edition · darwin arm64</p>
    </div>

    <script type="module" src="/src/splash/splash.ts"></script>
  </body>
</html>
